name: Bug report
description: Something does not work the way the documentation says it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check the pages in the `docs` folder first: the behaviour may be documented there. A small configuration and one or two posts that show the problem help more than a description of a whole site.
  - type: input
    id: version
    attributes:
      label: coffer version
      description: The output of `coffer --version`, or the tag or commit your site depends on.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: "v24.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran and the smallest `coffer.yaml` and content that show the problem. Does it happen on the example site (`npm run example`)?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error message or log, copied as text.
      render: text
    validations:
      required: false
