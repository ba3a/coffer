# The press kit: a factsheet (platforms and price come from the fields above
# unless the press kit gives its own), two descriptions in Markdown, and the
# logos and screenshots that journalists can download in full resolution.
pressKit:
  developer: Tove Marlowe
  releaseStatus: In development, no release date yet
  shortDescription: A relaxed puzzle game about fitting wooden joints together before the glue dries.
  longDescription: |
    Pieces fall, joints have to line up, and the glue is always a little faster
    than you. Tenon Tumble is made by one person in the spare hours of a
    workshop.

    - Short rounds that fit the minutes between jobs.
    - Every joint is one you can make by hand.
  logos:
    - file: press-kit/logo.png
      alt: Four wooden blocks in a staircase with a fifth one tipping over the top.
    - press-kit/logo.svg
  screenshots:
    - file: screenshot-1.jpg
      alt: Four wooden blocks in a row at the bottom of the board, one more block about to fall.
    - file: screenshot-2.jpg
      alt: A staircase of wooden blocks growing from the bottom of the board.
    - file: press-kit/on-the-bench.jpg
      alt: The game on a screen, photographed on a workbench.
